name: CI

# Runs on every push and every pull request. Vercel handles deployment (CD) on
# its own Git integration; this workflow is the CI gate that runs the checks.
#
# The daily schedule exists for the E2E job only: a once-a-day run against
# production is a small monitoring story — nothing else wakes up to tell us the
# live app still works. workflow_dispatch is there to re-run it on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run, so we don't burn minutes
# on commits that have already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs from the committed lockfile; it also builds the
      # better-sqlite3 native addon (ubuntu runners have the toolchain, and
      # prebuilt binaries are used where available).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  e2e:
    name: E2E (production)
    runs-on: ubuntu-latest

    # Deliberately a separate job from the typecheck gate rather than extra steps
    # inside it: a wobble in a network-dependent journey against production is a
    # different signal from a broken build, and must not be able to mask one.
    #
    # Skipped on pull requests. The suite targets the deployed app, so a PR run
    # would test production rather than the PR's own code — a green tick that
    # means nothing about the change under review.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries the browsers need on the ubuntu
      # runner. Only the two engines the suite actually uses are downloaded.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E
        run: npx playwright test

      # Uploaded on failure as well as success, because the traces and the
      # screenshots are the whole point of keeping a red run in the history.
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
